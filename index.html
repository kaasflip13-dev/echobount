<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EchoBound</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#070b12;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

button{
    font-family:inherit;
}

#game{
    width:100vw;
    height:100vh;
    display:block;
    background:#080d14;
}

/* =========================
   START MENU
========================= */

#menu{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 35%,#23374b 0%,#0d1622 35%,#05080d 75%);
    z-index:20;
}

.menuBox{
    width:min(850px,92vw);
    padding:55px;
    text-align:center;
    border:1px solid #49657d;
    background:rgba(7,13,21,.91);
    box-shadow:0 0 80px rgba(0,0,0,.8);
    border-radius:24px;
}

.logo{
    font-size:64px;
    letter-spacing:10px;
    font-weight:900;
    margin-bottom:8px;
    color:#dceeff;
    text-shadow:0 0 30px #5ba4ff;
}

.subtitle{
    color:#7f9db9;
    letter-spacing:5px;
    margin-bottom:45px;
}

.menuButtons{
    display:flex;
    flex-direction:column;
    gap:13px;
    max-width:390px;
    margin:auto;
}

.menuButton{
    border:1px solid #45647e;
    background:#111d29;
    color:#e8f4ff;
    padding:17px;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
    transition:.2s;
}

.menuButton:hover{
    background:#1c3448;
    border-color:#8dc9ff;
    transform:translateY(-2px);
}

.menuButton.main{
    background:#24567b;
    border-color:#69bdff;
    font-weight:bold;
}

#saveInfo{
    margin-top:20px;
    color:#71869a;
    font-size:13px;
}

/* =========================
   HUD
========================= */

#hud{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:5;
}

#stats{
    position:absolute;
    left:20px;
    top:20px;
    width:230px;
}

.bar{
    height:18px;
    background:#111820;
    border:1px solid #334554;
    margin-bottom:8px;
    border-radius:5px;
    overflow:hidden;
}

.barInner{
    height:100%;
    transition:width:.15s;
}

#healthBar{
    background:#e35b67;
}

#energyBar{
    background:#55bfff;
}

.statText{
    font-size:12px;
    color:#b7c9d7;
    margin-bottom:3px;
}

#objective{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 18px;
    background:rgba(5,10,16,.75);
    border:1px solid #30495c;
    border-radius:8px;
    color:#dceeff;
}

#location{
    position:absolute;
    right:20px;
    top:20px;
    color:#8ca8be;
    font-size:14px;
}

#weapon{
    position:absolute;
    right:25px;
    bottom:25px;
    text-align:right;
}

#weaponName{
    font-size:22px;
    font-weight:bold;
}

#ammo{
    color:#70c7ff;
    font-size:30px;
    margin-top:5px;
}

#hint{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:#8296a8;
    font-size:13px;
}

/* =========================
   PAUSE
========================= */

#pause{
    position:absolute;
    inset:0;
    background:rgba(2,5,9,.82);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:15;
}

.pauseBox{
    background:#0b131d;
    border:1px solid #41596c;
    padding:40px;
    width:min(500px,90vw);
    border-radius:18px;
    text-align:center;
}

.pauseBox h2{
    font-size:40px;
    margin-bottom:25px;
}

/* =========================
   ACHIEVEMENTS
========================= */

#achievement{
    position:absolute;
    right:25px;
    bottom:25px;
    width:310px;
    padding:18px;
    background:#101c28;
    border:1px solid #4d7594;
    border-radius:12px;
    transform:translateX(360px);
    transition:.5s;
    z-index:30;
}

#achievement.show{
    transform:translateX(0);
}

.achTitle{
    color:#75c8ff;
    font-size:12px;
    letter-spacing:2px;
    margin-bottom:5px;
}

.achName{
    font-size:19px;
    font-weight:bold;
}

/* =========================
   MAP
========================= */

#map{
    position:absolute;
    inset:0;
    background:rgba(3,7,11,.92);
    z-index:18;
    display:none;
    align-items:center;
    justify-content:center;
}

.mapBox{
    width:min(800px,90vw);
    height:min(650px,85vh);
    border:1px solid #415d70;
    background:#0b141d;
    border-radius:18px;
    padding:25px;
}

.mapBox h2{
    margin-bottom:15px;
}

#mapCanvas{
    width:100%;
    height:calc(100% - 55px);
    background:#071018;
    border:1px solid #263a49;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

    .logo{
        font-size:36px;
        letter-spacing:5px;
    }

    .menuBox{
        padding:30px 20px;
    }

    #stats{
        width:170px;
    }

    #objective{
        max-width:220px;
        text-align:center;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- =========================
     START MENU
========================= -->

<div id="menu">

    <div class="menuBox">

        <div class="logo">ECHOBOUND</div>
        <div class="subtitle">THE LOST SIGNAL</div>

        <div class="menuButtons">

            <button class="menuButton main" id="newGame">
                NEW RUN
            </button>

            <button class="menuButton" id="loadGame">
                CONTINUE
            </button>

            <button class="menuButton" id="achievementsButton">
                ACHIEVEMENTS
            </button>

            <button class="menuButton" id="controlsButton">
                CONTROLS
            </button>

        </div>

        <div id="saveInfo">
            Your journey is stored in this browser.
        </div>

    </div>

</div>


<!-- =========================
     HUD
========================= -->

<div id="hud">

    <div id="stats">

        <div class="statText">
            HEALTH
        </div>

        <div class="bar">
            <div id="healthBar" class="barInner"></div>
        </div>

        <div class="statText">
            ENERGY
        </div>

        <div class="bar">
            <div id="energyBar" class="barInner"></div>
        </div>

    </div>

    <div id="objective">
        Find the first signal
    </div>

    <div id="location">
        UNKNOWN SECTOR
    </div>

    <div id="weapon">

        <div id="weaponName">
            PULSE
        </div>

        <div id="ammo">
            12 / ∞
        </div>

    </div>

    <div id="hint">
        WASD • MOUSE • SPACE • E • M
    </div>

</div>


<!-- =========================
     PAUSE
========================= -->

<div id="pause">

    <div class="pauseBox">

        <h2>PAUSED</h2>

        <button class="menuButton main" id="resume">
            RESUME
        </button>

        <br>

        <button class="menuButton" id="save">
            SAVE RUN
        </button>

        <br>

        <button class="menuButton" id="quit">
            QUIT TO MENU
        </button>

    </div>

</div>


<!-- =========================
     ACHIEVEMENT
========================= -->

<div id="achievement">

    <div class="achTitle">
        ACHIEVEMENT UNLOCKED
    </div>

    <div class="achName" id="achievementName">
        First Signal
    </div>

</div>


<!-- =========================
     MAP
========================= -->

<div id="map">

    <div class="mapBox">

        <h2>SECTOR MAP</h2>

        <canvas id="mapCanvas"></canvas>

    </div>

</div>


<script>

/* =====================================================
   ECHOBOUND
   Original browser game
===================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const mapCanvas = document.getElementById("mapCanvas");
const mapCtx = mapCanvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

canvas.width = W;
canvas.height = H;

window.addEventListener("resize",()=>{

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;

});


/* =====================================================
   GAME STATE
===================================================== */

let gameRunning = false;
let paused = false;
let mapOpen = false;

let keys = {};

let mouse = {
    x:W/2,
    y:H/2,
    down:false
};

let world;
let player;

let bullets = [];
let enemies = [];
let particles = [];
let pickups = [];

let camera = {
    x:0,
    y:0
};

let time = 0;

let saveData = {

    exists:false,

    x:0,
    y:0,

    health:100,
    energy:100,

    ammo:12,

    credits:0,

    kills:0,

    signals:0,

    upgrades:0

};


/* =====================================================
   INPUT
===================================================== */

window.addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()] = true;

    if(e.key.toLowerCase()==="m"){
        toggleMap();
    }

    if(e.key==="Escape"){

        if(mapOpen){
            toggleMap();
            return;
        }

        togglePause();

    }

});

window.addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()] = false;

});

canvas.addEventListener("mousemove",e=>{

    const r = canvas.getBoundingClientRect();

    mouse.x = e.clientX-r.left;
    mouse.y = e.clientY-r.top;

});

canvas.addEventListener("mousedown",()=>{

    mouse.down = true;

});

window.addEventListener("mouseup",()=>{

    mouse.down = false;

});


/* =====================================================
   WORLD
===================================================== */

function createWorld(){

    return {

        width:4200,
        height:4200,

        zones:[

            {
                x:0,
                y:0,
                w:1400,
                h:1400,
                name:"THE QUIET FIELD",
                color:"#18252a"
            },

            {
                x:1400,
                y:0,
                w:1400,
                h:1400,
                name:"GLASS MARSH",
                color:"#15272a"
            },

            {
                x:2800,
                y:0,
                w:1400,
                h:1400,
                name:"THE RIFT",
                color:"#261b2a"
            },

            {
                x:0,
                y:1400,
                w:1400,
                h:1400,
                name:"OLD GARDENS",
                color:"#17271f"
            },

            {
                x:1400,
                y:1400,
                w:1400,
                h:1400,
                name:"THE SILENT CITY",
                color:"#20252c"
            },

            {
                x:2800,
                y:1400,
                w:1400,
                h:1400,
                name:"ASHEN RIDGE",
                color:"#29231e"
            },

            {
                x:0,
                y:2800,
                w:1400,
                h:1400,
                name:"BLUE WOODS",
                color:"#15232c"
            },

            {
                x:1400,
                y:2800,
                w:1400,
                h:1400,
                name:"THE DEEP",
                color:"#101b26"
            },

            {
                x:2800,
                y:2800,
                w:1400,
                h:1400,
                name:"SIGNAL ZERO",
                color:"#241c29"
            }

        ]

    };

}


/* =====================================================
   PLAYER
===================================================== */

function createPlayer(){

    return {

        x:700,
        y:700,

        r:18,

        speed:3.4,

        health:100,
        maxHealth:100,

        energy:100,
        maxEnergy:100,

        ammo:12,
        maxAmmo:12,

        credits:0,

        kills:0,

        signals:0,

        fireCooldown:0,

        dashCooldown:0,

        invincible:0,

        upgrades:0

    };

}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

    world = createWorld();

    player = createPlayer();

    bullets = [];
    enemies = [];
    particles = [];
    pickups = [];

    time = 0;

    spawnInitialEnemies();

    gameRunning = true;
    paused = false;

    document.getElementById("menu").style.display="none";
    document.getElementById("pause").style.display="none";

    updateHUD();

}


/* =====================================================
   LOAD GAME
===================================================== */

function loadGame(){

    const raw = localStorage.getItem("echobound_save");

    if(!raw){

        alert("Er is nog geen opgeslagen run.");

        return;

    }

    try{

        const data = JSON.parse(raw);

        world = createWorld();

        player = createPlayer();

        player.x = data.x;
        player.y = data.y;

        player.health = data.health;
        player.energy = data.energy;

        player.ammo = data.ammo;

        player.credits = data.credits;

        player.kills = data.kills;

        player.signals = data.signals;

        player.upgrades = data.upgrades;

        bullets=[];
        enemies=[];
        particles=[];
        pickups=[];

        spawnInitialEnemies();

        gameRunning=true;
        paused=false;

        document.getElementById("menu").style.display="none";

        updateHUD();

    }catch(e){

        alert("Savebestand kon niet worden geladen.");

    }

}


/* =====================================================
   SAVE
===================================================== */

function saveGame(){

    if(!player)return;

    const data={

        x:player.x,
        y:player.y,

        health:player.health,
        energy:player.energy,

        ammo:player.ammo,

        credits:player.credits,

        kills:player.kills,

        signals:player.signals,

        upgrades:player.upgrades

    };

    localStorage.setItem(
        "echobound_save",
        JSON.stringify(data)
    );

    saveData.exists=true;

    showAchievement("RUN SAVED");

}


/* =====================================================
   ENEMIES
===================================================== */

function spawnInitialEnemies(){

    for(let i=0;i<25;i++){

        spawnEnemy();

    }

}


function spawnEnemy(){

    let x;
    let y;

    do{

        x = Math.random()*world.width;
        y = Math.random()*world.height;

    }while(distance(x,y,player.x,player.y)<500);

    enemies.push({

        x:x,
        y:y,

        r:17,

        speed:0.7+Math.random()*0.7,

        hp:2,

        maxHp:2,

        cooldown:Math.random()*150,

        phase:Math.random()*Math.PI*2

    });

}


/* =====================================================
   PICKUPS
===================================================== */

function spawnPickup(x,y){

    pickups.push({

        x:x,
        y:y,

        type:Math.random()<.5?"energy":"credit",

        r:9,

        phase:Math.random()*6

    });

}


/* =====================================================
   SHOOTING
===================================================== */

function shoot(){

    if(player.fireCooldown>0)return;

    if(player.ammo<=0){

        player.ammo=player.maxAmmo;

        return;

    }

    player.ammo--;

    player.fireCooldown=10;

    const wx = camera.x+mouse.x;
    const wy = camera.y+mouse.y;

    const angle=Math.atan2(
        wy-player.y,
        wx-player.x
    );

    bullets.push({

        x:player.x,
        y:player.y,

        vx:Math.cos(angle)*10,
        vy:Math.sin(angle)*10,

        life:80

    });

}


/* =====================================================
   UPDATE
===================================================== */

function update(){

    if(!gameRunning || paused || mapOpen)return;

    time++;

    updatePlayer();

    updateBullets();

    updateEnemies();

    updatePickups();

    updateParticles();

    updateCamera();

    updateHUD();

    if(mouse.down){
        shoot();
    }

}


/* =====================================================
   PLAYER UPDATE
===================================================== */

function updatePlayer(){

    let dx=0;
    let dy=0;

    if(keys["w"])dy--;
    if(keys["s"])dy++;
    if(keys["a"])dx--;
    if(keys["d"])dx++;

    if(dx!==0 || dy!==0){

        const len=Math.hypot(dx,dy);

        dx/=len;
        dy/=len;

        player.x+=dx*player.speed;
        player.y+=dy*player.speed;

    }

    /* DASH */

    if(keys[" "] && player.dashCooldown<=0){

        if(player.energy>=25){

            let dx=0;
            let dy=0;

            if(keys["w"])dy--;
            if(keys["s"])dy++;
            if(keys["a"])dx--;
            if(keys["d"])dx++;

            if(dx!==0 || dy!==0){

                const len=Math.hypot(dx,dy);

                dx/=len;
                dy/=len;

                player.x+=dx*130;
                player.y+=dy*130;

                player.energy-=25;

                player.dashCooldown=70;

                burst(
                    player.x,
                    player.y,
                    14
                );

            }

        }

    }

    if(player.dashCooldown>0){
        player.dashCooldown--;
    }

    if(player.fireCooldown>0){
        player.fireCooldown--;
    }

    if(player.invincible>0){
        player.invincible--;
    }

    player.energy=Math.min(
        player.maxEnergy,
        player.energy+.12
    );

    player.x=Math.max(
        30,
        Math.min(world.width-30,player.x)
    );

    player.y=Math.max(
        30,
        Math.min(world.height-30,player.y)
    );

}


/* =====================================================
   BULLETS
===================================================== */

function updateBullets(){

    for(let i=bullets.length-1;i>=0;i--){

        const b=bullets[i];

        b.x+=b.vx;
        b.y+=b.vy;

        b.life--;

        let hit=false;

        for(let j=enemies.length-1;j>=0;j--){

            const e=enemies[j];

            if(distance(
                b.x,b.y,
                e.x,e.y
            )<e.r+5){

                e.hp--;

                burst(
                    e.x,
                    e.y,
                    5
                );

                hit=true;

                if(e.hp<=0){

                    player.kills++;

                    spawnPickup(
                        e.x,
                        e.y
                    );

                    enemies.splice(j,1);

                    checkAchievements();

                }

                break;

            }

        }

        if(
            hit ||
            b.life<=0 ||
            b.x<0 ||
            b.y<0 ||
            b.x>world.width ||
            b.y>world.height
        ){

            bullets.splice(i,1);

        }

    }

}


/* =====================================================
   ENEMIES UPDATE
===================================================== */

function updateEnemies(){

    for(const e of enemies){

        const dx=player.x-e.x;
        const dy=player.y-e.y;

        const d=Math.hypot(dx,dy);

        if(d>45){

            e.x+=(dx/d)*e.speed;
            e.y+=(dy/d)*e.speed;

        }

        e.phase+=.04;

        e.cooldown--;

        if(d<500 && e.cooldown<=0){

            e.cooldown=120+Math.random()*100;

            const angle=Math.atan2(
                player.y-e.y,
                player.x-e.x
            );

            bullets.push({

                x:e.x,
                y:e.y,

                vx:Math.cos(angle)*4,
                vy:Math.sin(angle)*4,

                life:130,

                enemy:true

            });

        }

        if(d<player.r+e.r){

            damagePlayer(.35);

        }

    }

}


/* =====================================================
   PICKUPS UPDATE
===================================================== */

function updatePickups(){

    for(let i=pickups.length-1;i>=0;i--){

        const p=pickups[i];

        p.phase+=.05;

        if(distance(
            player.x,
            player.y,
            p.x,
            p.y
        )<player.r+p.r+8){

            if(p.type==="energy"){

                player.energy=Math.min(
                    player.maxEnergy,
                    player.energy+35
                );

            }else{

                player.credits+=10;

            }

            burst(p.x,p.y,10);

            pickups.splice(i,1);

        }

    }

}


/* =====================================================
   DAMAGE
===================================================== */

function damagePlayer(amount){

    if(player.invincible>0)return;

    player.health-=amount;

    player.invincible=30;

    if(player.health<=0){

        player.health=0;

        gameOver();

    }

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    gameRunning=false;

    setTimeout(()=>{

        const again=confirm(
            "RUN ENDED\n\n"+
            "Kills: "+player.kills+
            "\nSignals: "+player.signals+
            "\n\nOpnieuw proberen?"
        );

        if(again){

            startGame();

        }else{

            document.getElementById("menu").style.display="flex";

        }

    },100);

}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

    camera.x=player.x-W/2;
    camera.y=player.y-H/2;

    camera.x=Math.max(
        0,
        Math.min(
            world.width-W,
            camera.x
        )
    );

    camera.y=Math.max(
        0,
        Math.min(
            world.height-H,
            camera.y
        )
    );

}


/* =====================================================
   PARTICLES
===================================================== */

function burst(x,y,count){

    for(let i=0;i<count;i++){

        const a=Math.random()*Math.PI*2;

        const speed=Math.random()*3+1;

        particles.push({

            x:x,
            y:y,

            vx:Math.cos(a)*speed,
            vy:Math.sin(a)*speed,

            life:30+Math.random()*30,

            size:2+Math.random()*3

        });

    }

}


function updateParticles(){

    for(let i=particles.length-1;i>=0;i--){

        const p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.vx*=.96;
        p.vy*=.96;

        p.life--;

        if(p.life<=0){

            particles.splice(i,1);

        }

    }

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    if(!world || !player)return;

    drawWorld();

    drawPickups();

    drawEnemies();

    drawBullets();

    drawParticles();

    drawPlayer();

}


/* =====================================================
   WORLD DRAW
===================================================== */

function drawWorld(){

    ctx.fillStyle="#080e14";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    for(const zone of world.zones){

        ctx.fillStyle=zone.color;

        ctx.fillRect(
            zone.x-camera.x,
            zone.y-camera.y,
            zone.w,
            zone.h
        );

    }

    /* GRID */

    ctx.strokeStyle="rgba(120,170,200,.06)";
    ctx.lineWidth=1;

    const grid=100;

    for(
        let x=Math.floor(camera.x/grid)*grid;
        x<camera.x+W;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            x-camera.x,
            0
        );

        ctx.lineTo(
            x-camera.x,
            H
        );

        ctx.stroke();

    }

    for(
        let y=Math.floor(camera.y/grid)*grid;
        y<camera.y+H;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y-camera.y
        );

        ctx.lineTo(
            W,
            y-camera.y
        );

        ctx.stroke();

    }

}


/* =====================================================
   PLAYER DRAW
===================================================== */

function drawPlayer(){

    const x=player.x-camera.x;
    const y=player.y-camera.y;

    const angle=Math.atan2(
        camera.y+mouse.y-player.y,
        camera.x+mouse.x-player.x
    );

    /* shadow */

    ctx.fillStyle="rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+10,
        22,
        9,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* body */

    ctx.fillStyle=
        player.invincible>0
        ?"white"
        :"#9bd7ff";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        player.r,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* direction */

    ctx.strokeStyle="#dff5ff";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(
        x,
        y
    );

    ctx.lineTo(
        x+Math.cos(angle)*30,
        y+Math.sin(angle)*30
    );

    ctx.stroke();

}


/* =====================================================
   ENEMY DRAW
===================================================== */

function drawEnemies(){

    for(const e of enemies){

        const x=e.x-camera.x;
        const y=e.y-camera.y;

        const pulse=
            Math.sin(e.phase)*2;

        ctx.fillStyle="#c77cff";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            e.r+pulse,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle="#e8c9ff";
        ctx.lineWidth=2;

        ctx.stroke();

        /* HP */

        ctx.fillStyle="#111";

        ctx.fillRect(
            x-18,
            y-28,
            36,
            4
        );

        ctx.fillStyle="#d98cff";

        ctx.fillRect(
            x-18,
            y-28,
            36*(e.hp/e.maxHp),
            4
        );

    }

}


/* =====================================================
   BULLET DRAW
===================================================== */

function drawBullets(){

    for(const b of bullets){

        const x=b.x-camera.x;
        const y=b.y-camera.y;

        ctx.fillStyle=
            b.enemy
            ?" #ff8a6b"
            :"#83dcff";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            b.enemy?4:5,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =====================================================
   PICKUPS DRAW
===================================================== */

function drawPickups(){

    for(const p of pickups){

        const x=p.x-camera.x;
        const y=p.y-camera.y+
            Math.sin(p.phase)*4;

        ctx.fillStyle=
            p.type==="energy"
            ?" #66d9ff"
            :"#ffe47a";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.r,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =====================================================
   PARTICLES DRAW
===================================================== */

function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha=
            Math.max(0,p.life/50);

        ctx.fillStyle="#a7ddff";

        ctx.fillRect(
            p.x-camera.x,
            p.y-camera.y,
            p.size,
            p.size
        );

    }

    ctx.globalAlpha=1;

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    if(!player)return;

    document.getElementById("healthBar")
        .style.width=
        (player.health/player.maxHealth*100)+"%";

    document.getElementById("energyBar")
        .style.width=
        (player.energy/player.maxEnergy*100)+"%";

    document.getElementById("ammo").textContent=
        player.ammo+" / ∞";

    const zone=getZone();

    if(zone){

        document.getElementById("location")
            .textContent=zone.name;

    }

    document.getElementById("objective")
        .textContent=
        player.signals===0
        ?"Find the first signal"
        :"Signals found: "+player.signals+"/3";

}


/* =====================================================
   ZONE
===================================================== */

function getZone(){

    return world.zones.find(z=>
        player.x>=z.x &&
        player.x<z.x+z.w &&
        player.y>=z.y &&
        player.y<z.y+z.h
    );

}


/* =====================================================
   MAP
===================================================== */

function toggleMap(){

    if(!gameRunning)return;

    mapOpen=!mapOpen;

    document.getElementById("map").style.display=
        mapOpen
        ?"flex"
        :"none";

    if(mapOpen){

        drawMap();

    }

}


function drawMap(){

    const rect=mapCanvas.getBoundingClientRect();

    mapCanvas.width=rect.width;
    mapCanvas.height=rect.height;

    mapCtx.clearRect(
        0,
        0,
        mapCanvas.width,
        mapCanvas.height
    );

    const scale=
        Math.min(
            mapCanvas.width/world.width,
            mapCanvas.height/world.height
        )*.9;

    const ox=
        (mapCanvas.width-world.width*scale)/2;

    const oy=
        (mapCanvas.height-world.height*scale)/2;

    for(const z of world.zones){

        mapCtx.fillStyle=z.color;

        mapCtx.fillRect(
            ox+z.x*scale,
            oy+z.y*scale,
            z.w*scale,
            z.h*scale
        );

        mapCtx.strokeStyle="#526b7d";

        mapCtx.strokeRect(
            ox+z.x*scale,
            oy+z.y*scale,
            z.w*scale,
            z.h*scale
        );

    }

    mapCtx.fillStyle="#ffffff";

    mapCtx.beginPath();

    mapCtx.arc(
        ox+player.x*scale,
        oy+player.y*scale,
        7,
        0,
        Math.PI*2
    );

    mapCtx.fill();

}


/* =====================================================
   PAUSE
===================================================== */

function togglePause(){

    if(!gameRunning)return;

    paused=!paused;

    document.getElementById("pause")
        .style.display=
        paused
        ?"flex"
        :"none";

}


/* =====================================================
   ACHIEVEMENTS
===================================================== */

function showAchievement(name){

    const box=
        document.getElementById("achievement");

    document.getElementById(
        "achievementName"
    ).textContent=name;

    box.classList.add("show");

    setTimeout(()=>{

        box.classList.remove("show");

    },3000);

}


function checkAchievements(){

    if(player.kills===1){

        showAchievement(
            "FIRST ENCOUNTER"
        );

    }

    if(player.kills===10){

        showAchievement(
            "TEN ECHOES"
        );

    }

}


/* =====================================================
   DISTANCE
===================================================== */

function distance(x1,y1,x2,y2){

    return Math.hypot(
        x1-x2,
        y1-y2
    );

}


/* =====================================================
   BUTTONS
===================================================== */

document.getElementById("newGame")
.addEventListener("click",()=>{

    startGame();

});


document.getElementById("loadGame")
.addEventListener("click",()=>{

    loadGame();

});


document.getElementById("resume")
.addEventListener("click",()=>{

    togglePause();

});


document.getElementById("save")
.addEventListener("click",()=>{

    saveGame();

});


document.getElementById("quit")
.addEventListener("click",()=>{

});

        "Linkermuisknop = schieten\n"+

        "M = kaart\n"+
        "ESC = pauze"
    );

});


document.getElementById("achievementsButton")
.addEventListener("click",()=>{

    alert(
        "ACHIEVEMENTS\n\n"+
        "FIRST ENCOUNTER\n"+
        "Versla je eerste vijand.\n\n"+
        "TEN ECHOES\n"+
        "Versla 10 vijanden.\n\n"+
        "RUN SAVED\n"+
        "Sla je run op."
    );

});


/* =====================================================
   GAME LOOP
===================================================== */

function loop(){

    update();

    draw();

    requestAnimationFrame(loop);

}


/* =====================================================
   START
===================================================== */

loop();

</script>
